name = "winnat-bug-gateway"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Built-in rate limiting does not require KV storage or namespace provisioning.
# These namespace IDs must be unique within the Cloudflare account.
[[ratelimits]]
name = "RATE_LIMIT_IP"
namespace_id = "31001"
[ratelimits.simple]
limit = 6
period = 60

[[ratelimits]]
name = "RATE_LIMIT_GLOBAL"
namespace_id = "31002"
[ratelimits.simple]
limit = 30
period = 60
