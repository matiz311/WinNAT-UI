name: Initial Issue Triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing open issue number to triage if not already assessed"
        type: number
        required: true
      dry_run:
        description: "Only display the proposed analysis (no writes)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: initial-issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Preliminarily assess issue
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
      - name: Unit tests for initial triage
        run: python -m unittest tests.test_issue_triage_bot -v
      - name: Assess open issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python tools/issue_triage_bot.py
