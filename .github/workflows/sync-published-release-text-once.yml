name: One-time sync published release descriptions

# Temporary documentation-only workflow. No Git tags or release assets are changed.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-published-release-text-once.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'docs: synchronize existing release descriptions after version migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical documentation
        run: python3 -m unittest -v test_version
      - name: Preview release text updates
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 sync_release_notes.py
      - name: Apply text-only updates to published Release descriptions
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 sync_release_notes.py --apply
