name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3
      - name: Verify build tools
        run: |
          python --version
          python -m PyInstaller --version
      - name: Validate syntax
        run: python -m compileall -q app.py network.py
      - name: Package executable
        run: pyinstaller --noconfirm --clean --noupx --onedir --windowed --uac-admin --version-file version_info.txt --name WinNAT-UI app.py
      - name: Verify Windows executable metadata
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/WinNAT-UI/WinNAT-UI.exe').Path
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List ProductName,FileDescription,CompanyName,FileVersion,ProductVersion
          if ($info.ProductName -ne 'WinNAT UI') { throw 'Product metadata mismatch.' }
          $signature = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.Status -ne 'NotSigned' -and $signature.Status -ne 'Valid') { throw 'Invalid or unexpected digital signature.' }
      - name: Prepare release manifest
        shell: pwsh
        run: |
          $exe = "dist/WinNAT-UI/WinNAT-UI.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "SHA256: $hash" | Out-File -FilePath "dist/WinNAT-UI/SHA256.txt" -Encoding utf8
          "Prior build reported Defender Bearfoos.B!ml detection. This build must pass the required GitHub Defender scan; verify again locally." | Out-File -FilePath "dist/WinNAT-UI/SECURITY.txt" -Encoding utf8
      - name: Microsoft Defender verification (required)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanPath = Join-Path $env:GITHUB_WORKSPACE 'dist/WinNAT-UI'
          $exePath = Join-Path $scanPath 'WinNAT-UI.exe'
          if (-not (Test-Path $exePath)) { throw 'EXE not found' }
          $status = Get-MpComputerStatus -ErrorAction Stop
          $status | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            throw 'Defender is not operational. Build is not approved.'
          }
          $start = Get-Date
          try {
            Start-MpScan -ScanType CustomScan -ScanPath $scanPath -ErrorAction Stop
          } catch {
            throw "Defender scan failed or is unavailable: $($_.Exception.Message)"
          }
          $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            ($_.InitialDetectionTime -ge $start.AddMinutes(-1)) -and
            (($_.Resources | Out-String) -match 'WinNAT-UI|dist')
          })
          if ($detections.Count -gt 0) {
            $detections | Format-List ThreatID,InitialDetectionTime,Resources,ActionSuccess | Out-String | Write-Host
            throw 'Defender found a threat in this build. Publication blocked.'
          }
          if (-not (Test-Path $exePath)) { throw 'Executable is missing after scan; possible quarantine.' }
          "Defender scan completed: $(Get-Date -Format o)" | Out-File -FilePath (Join-Path $scanPath 'DEFENDER_SCAN.txt') -Encoding utf8
          "Signature version: $($status.AntivirusSignatureVersion)" | Add-Content (Join-Path $scanPath 'DEFENDER_SCAN.txt')
          Write-Host 'Defender scan completed without reported detections for this build.'
      - name: Validate Python source imports
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').glob('*.py')]"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WinNAT-UI-Windows
          path: dist/WinNAT-UI/
          if-no-files-found: error
