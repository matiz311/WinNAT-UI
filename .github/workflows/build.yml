name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Validate syntax
        run: python -m compileall -q app.py network.py
      - name: Package executable
        run: pyinstaller --noconfirm --clean --noupx --onedir --windowed --uac-admin --version-file version_info.txt --name WinNAT-UI app.py
      - name: Prepare release manifest
        shell: pwsh
        run: |
          $exe = "dist/WinNAT-UI/WinNAT-UI.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "SHA256: $hash" | Out-File -FilePath "dist/WinNAT-UI/SHA256.txt" -Encoding utf8
          "Security review: NOT VERIFIED. Prior build reported Defender Bearfoos.B!ml detection. Do not run until locally scanned and investigated." | Out-File -FilePath "dist/WinNAT-UI/SECURITY.txt" -Encoding utf8
      - name: Attempt Defender scan (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Start-MpScan -ScanType CustomScan -ScanPath "$env:GITHUB_WORKSPACE\\dist\\WinNAT-UI" -ErrorAction Stop
            $found = @(Get-MpThreatDetection | Where-Object { $_.Resources -match 'WinNAT-UI' })
            if ($found.Count -gt 0) { throw 'Threat detected in package' }
            Write-Host "Defender completed scan; verify locally before execution."
          } catch {
            Write-Error "Defender scan not completed / detected threat: $_"
            exit 1
          }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WinNAT-UI-Windows
          path: dist/WinNAT-UI/
          if-no-files-found: error
