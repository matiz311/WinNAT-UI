name: Build Windows executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_feature_release:
        description: 'Autorizza pubblicazione MINOR/MAJOR dopo aver verificato il riepilogo delle feature e correzioni'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3
      - name: Verify build tools
        run: |
          python --version
          python -m PyInstaller --version
      - name: Validate syntax
        run: python -m compileall -q app.py version.py network.py network_plan.py network_guide.py network_rollback.py ui_theme.py tools/release.py test_release_policy.py test_network_guide.py test_network_rollback.py test_ui_helpers.py test_version.py test_windows_ps.py
      - name: Run tests (planning, UI helpers, versioning, real PowerShell)
        run: python -m unittest -v test_release_policy test_network_guide test_network_rollback test_ui_helpers test_version test_windows_ps
      - name: Run read-only diagnostic script (smoke test)
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'diag'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/WinNAT-Diagnostica.ps1 -OutputFolder $out
          if (-not (Get-ChildItem $out -Filter 'WinNAT-Diagnostica-*.json')) { throw 'Diagnostic JSON not produced.' }
          Get-Content (Get-ChildItem $out -Filter '*.json' | Select-Object -First 1).FullName -Raw | ConvertFrom-Json | Out-Null
      - name: Check version is not already released
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python tools/release.py version).Trim()
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::warning::v$version e' gia' pubblicata: aggiorna version.py e CHANGELOG.md per una nuova release."
          }
          exit 0
      - name: Package executable
        run: pyinstaller --noconfirm --clean --noupx --onedir --windowed --uac-admin --version-file version_info.txt --icon assets/winnat-ui.ico --add-data "assets/winnat-ui.ico;assets" --add-data "assets/winnat-ui-256.png;assets" --add-data "assets/winnat-ui-32.png;assets" --name WinNAT-UI app.py
      - name: Verify Windows executable metadata
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/WinNAT-UI/WinNAT-UI.exe').Path
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List ProductName,FileDescription,CompanyName,FileVersion,ProductVersion
          if ($info.ProductName -ne 'WinNAT UI') { throw 'Product metadata mismatch.' }
          foreach ($asset in 'winnat-ui.ico','winnat-ui-256.png','winnat-ui-32.png') {
            if (-not (Get-ChildItem 'dist/WinNAT-UI' -Recurse -Filter $asset)) { throw "Icon asset missing from build: $asset" }
          }
          Add-Type -AssemblyName System.Drawing
          if (-not [System.Drawing.Icon]::ExtractAssociatedIcon($exe)) { throw 'Executable has no icon.' }
          $expected = (python tools/release.py version).Trim() + '.0'
          if ($info.FileVersion -ne $expected -or $info.ProductVersion -ne $expected) { throw "Version mismatch: exe $($info.FileVersion), version.py $expected" }
          $signature = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.Status -ne 'NotSigned' -and $signature.Status -ne 'Valid') { throw 'Invalid or unexpected digital signature.' }
      - name: Prepare release manifest
        shell: pwsh
        run: |
          $exe = "dist/WinNAT-UI/WinNAT-UI.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "SHA256: $hash" | Out-File -FilePath "dist/WinNAT-UI/SHA256.txt" -Encoding utf8
          "Prior build reported Defender Bearfoos.B!ml detection. This build must pass the required GitHub Defender scan; verify again locally." | Out-File -FilePath "dist/WinNAT-UI/SECURITY.txt" -Encoding utf8
      - name: Microsoft Defender verification (required)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanPath = Join-Path $env:GITHUB_WORKSPACE 'dist/WinNAT-UI'
          $exePath = Join-Path $scanPath 'WinNAT-UI.exe'
          if (-not (Test-Path $exePath)) { throw 'EXE not found' }
          $status = Get-MpComputerStatus -ErrorAction Stop
          $status | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            throw 'Defender is not operational. Build is not approved.'
          }
          $start = Get-Date
          try {
            Start-MpScan -ScanType CustomScan -ScanPath $scanPath -ErrorAction Stop
          } catch {
            throw "Defender scan failed or is unavailable: $($_.Exception.Message)"
          }
          $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            ($_.InitialDetectionTime -ge $start.AddMinutes(-1)) -and
            (($_.Resources | Out-String) -match 'WinNAT-UI|dist')
          })
          if ($detections.Count -gt 0) {
            $detections | Format-List ThreatID,InitialDetectionTime,Resources,ActionSuccess | Out-String | Write-Host
            throw 'Defender found a threat in this build. Publication blocked.'
          }
          if (-not (Test-Path $exePath)) { throw 'Executable is missing after scan; possible quarantine.' }
          "Defender scan completed: $(Get-Date -Format o)" | Out-File -FilePath (Join-Path $scanPath 'DEFENDER_SCAN.txt') -Encoding utf8
          "Signature version: $($status.AntivirusSignatureVersion)" | Add-Content (Join-Path $scanPath 'DEFENDER_SCAN.txt')
          Write-Host 'Defender scan completed without reported detections for this build.'
      - name: Validate Python source imports
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').glob('*.py')]"
      - name: Write unique build identifier
        shell: pwsh
        run: |
          $semanticVersion = (python tools/release.py version).Trim()
          $buildId = "$semanticVersion+ci.$env:GITHUB_RUN_NUMBER.$($env:GITHUB_SHA.Substring(0,8))"
          "Functional version: $semanticVersion" | Out-File "dist/WinNAT-UI/BUILD_INFO.txt" -Encoding utf8
          "Build identifier: $buildId" | Add-Content "dist/WinNAT-UI/BUILD_INFO.txt"
          "Git commit: $env:GITHUB_SHA" | Add-Content "dist/WinNAT-UI/BUILD_INFO.txt"
          "Workflow: $env:GITHUB_RUN_ID" | Add-Content "dist/WinNAT-UI/BUILD_INFO.txt"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WinNAT-UI-Windows-${{ github.run_number }}-${{ github.sha }}
          path: dist/WinNAT-UI/
          if-no-files-found: error
      - name: Authorize semantic release
        if: github.ref == 'refs/heads/main'
        id: release_gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          FEATURE_APPROVED: ${{ inputs.approve_feature_release || false }}
        run: |
          # Compare with the latest PUBLISHED release: the version jump that
          # matters is from what users have, not from the previous commit
          # (squash merges, docs-only commits, shallow checkouts).
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $tag -match '^v(\d+\.\d+\.\d+)$') {
            $previous = $Matches[1]
          } else {
            $previousFile = git show HEAD^:version.py
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the previous version for release approval.' }
            if (($previousFile -join "`n") -notmatch 'VERSION = "([^"]+)"') { throw 'Previous version not found.' }
            $previous = $Matches[1]
          }
          $options = @()
          if ($env:IS_MANUAL -eq 'true') { $options += '--manual' }
          if ($env:FEATURE_APPROVED -eq 'true') { $options += '--approved' }
          $decision = python tools/release.py gate $previous @options
          if ($LASTEXITCODE -ne 0) { throw "Release policy check failed: $decision" }
          Write-Host "Release decision: $decision (previous=$previous)"
          if ($decision -like 'allowed:*') {
            "allowed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "allowed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::notice::MINOR/MAJOR richiede riepilogo e approvazione tramite workflow_dispatch. Build artifact disponibile."
          }
      - name: Publish public GitHub release
        if: github.ref == 'refs/heads/main' && steps.release_gate.outputs.allowed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (python tools/release.py version).Trim()
          $tag = "v$version"
          $head = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify main branch HEAD.' }
          if ($head.Trim() -ne $env:GITHUB_SHA) {
            Write-Host 'A newer commit exists. Skip release of a stale build.'
            exit 0
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. No overwrite performed."
            exit 0
          }
          $sourceDir = (Resolve-Path 'dist/WinNAT-UI').Path
          $zip = (Join-Path $env:RUNNER_TEMP 'WinNAT-UI-Windows.zip')
          Compress-Archive -Path (Join-Path $sourceDir '*') -DestinationPath $zip -Force
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $changes = (python tools/release.py notes) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'CHANGELOG.md section missing for this version.' }
          $footer = @'

          ---
          **UNSIGNED DEVELOPMENT BUILD**. The project is applying to SignPath Foundation for free code signing. No SignPath certificate has yet been issued, and this version is not signed or endorsed by SignPath Foundation.

          Signing policy: https://github.com/matiz311/WinNAT-UI/blob/main/CODE_SIGNING_POLICY.md
          Privacy policy: https://github.com/matiz311/WinNAT-UI/blob/main/PRIVACY.md
          Changelog: https://github.com/matiz311/WinNAT-UI/blob/main/CHANGELOG.md

          This ZIP contains the complete application directory and the SHA256.txt and DEFENDER_SCAN.txt manifests. GitHub Actions performed a Microsoft Defender scan before release. Scan success does not guarantee that the software is harmless; users should verify downloads locally.

          When approved and signing is activated, the required attribution will be: "Free code signing provided by SignPath.io, certificate by SignPath Foundation".
          '@
          $releaseNotes = $changes + "`n" + ($footer -replace '(?m)^          ', '')
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $releaseNotes -Encoding utf8
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WinNAT UI $tag" --notes-file $notesFile --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
