name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Validate syntax
        run: python -m compileall -q app.py network.py
      - name: Package executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name WinNAT-UI app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WinNAT-UI-Windows
          path: dist/WinNAT-UI.exe
          if-no-files-found: error
