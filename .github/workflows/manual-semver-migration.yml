name: Historical SemVer migration (manual, guarded)

# Temporary recovery-era workflow. Delete after verified migration.
on:
  # One-time launch from an exact opt-in file and commit marker.
  # Remove this push trigger immediately after the run has been accepted.
  push:
    branches: [main]
    paths:
      - .github/semver-launch-approved.txt
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type RENUMBER_28_RELEASES to approve historical republishing'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-semver-republish-exclusive
  cancel-in-progress: false

jobs:
  preflight_and_backup:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'ops: activate one-time SemVer migration [RENUMBER_28_RELEASES]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Require exact approval before downloading or changing releases
        env:
          USER_APPROVAL: ${{ inputs.approval }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$USER_APPROVAL" = "RENUMBER_28_RELEASES" ] || { echo '::error::Dispatch approval missing.'; exit 2; }
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$PUSH_MESSAGE" = "ops: activate one-time SemVer migration [RENUMBER_28_RELEASES]" ] || { echo '::error::Push approval missing.'; exit 2; }
            [ "$GITHUB_REF" = "refs/heads/main" ] || exit 2
          else
            echo '::error::Unsupported workflow event.'
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          ref: aa098b4036d5fefcf5768af9fab734c1a58f18ab
          path: migration
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline migration safety tests
        working-directory: migration
        run: |
          python -m unittest -v test_migrate_release_history test_execute_semver_migration
      - name: Verify and back up all 28 original and replacement ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python migration/tools/execute_semver_migration.py backup --plan migration/SEMVER_MIGRATION_PLAN.md --work work --run-id 38897773608
      - name: Preserve exact source refs
        run: git -C migration bundle create "$GITHUB_WORKSPACE/work/historical-source-refs.bundle" --tags
      - name: Upload immutable original backup
        uses: actions/upload-artifact@v4
        with:
          name: verified-historical-release-backup
          path: |
            work/originals/
            work/migration_manifest.json
            work/historical-source-refs.bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload verified staged replacement packages
        uses: actions/upload-artifact@v4
        with:
          name: verified-staged-release-packages
          path: work/staged/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  republish:
    needs: preflight_and_backup
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Require repository secret before any operations
        env:
          MIGRATION_PAT: ${{ secrets.WINNAT_MIGRATION_PAT }}
        run: |
          if [ -z "$MIGRATION_PAT" ]; then
            echo '::error::WINNAT_MIGRATION_PAT is required. No releases were changed.'
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          ref: aa098b4036d5fefcf5768af9fab734c1a58f18ab
          fetch-depth: 0
          token: ${{ secrets.WINNAT_MIGRATION_PAT }}
      - uses: actions/checkout@v4
        with:
          ref: bf850ea55eae6addab1eb66dc48c1203f72be0ab
          path: release_docs
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-historical-release-backup
          path: work/
      - uses: actions/download-artifact@v4
        with:
          name: verified-staged-release-packages
          path: work/staged/
      - name: Run verified replacement with permission probe and REST rollback
        env:
          GH_TOKEN: ${{ secrets.WINNAT_MIGRATION_PAT }}
        run: |
          python tools/execute_semver_migration.py publish --work work --docs release_docs
