name: TEMP screenshot finestra aggiornamento
on:
  push:
    branches: [tmp/screenshot-aggiornamento]
permissions:
  contents: write
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: python -m pip install pyinstaller==6.22.3
      - name: tests like CI
        run: |
          New-Item -ItemType Directory out -Force | Out-Null
          python -m unittest discover -s tests -t . -v 2>&1 | Out-File out/tests.txt -Encoding utf8
          "exit=$LASTEXITCODE" | Add-Content out/tests.txt
          Get-ChildItem $env:TEMP -Recurse -Filter update-log.txt -ErrorAction SilentlyContinue | % { "== $($_.FullName)"; Get-Content $_.FullName } | Out-File out/logs.txt -Encoding utf8
      - if: always()
        shell: bash
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -f out; git commit -qm out; git push origin HEAD:tmp/screenshot-risultati -f
