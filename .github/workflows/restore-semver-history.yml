name: Recover original WinNAT-UI releases

on:
  push:
    branches: [maintenance/semver-history-migration]
    paths:
      - .github/workflows/restore-semver-history.yml
      - tools/restore_semver_history.py

permissions:
  contents: write
  actions: read

concurrency:
  group: historical-semver-republish-exclusive
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable backup from the failed republish run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38899366384 --repo matiz311/WinNAT-UI --name verified-historical-release-backup --dir work
          test -f work/migration_manifest.json
      - name: Restore original tags and release ZIPs using an authorized owner token
        env:
          GH_TOKEN: ${{ secrets.WINNAT_MIGRATION_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Repository secret WINNAT_MIGRATION_PAT is required (Contents/Workflows write).'
            exit 2
          fi
          python tools/restore_semver_history.py work
