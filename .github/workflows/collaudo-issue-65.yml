name: Collaudo Windows Issue 65 (temporaneo)

on:
  push:
    branches: ['collaudo/issue-65-windows']

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  collaudo:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      BUILD_RUN: '38973824643'
      BUILD_COMMIT: 3eb242657883c28a7bdf5c15a432c2ea2e506640
      DISCOVERY: '1'
      ISSUE_BUTTON_XY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/collaudo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pywinauto==0.6.9 pillow
      - name: Scarica la build CI #313 del commit corretto
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: build
      - name: Collaudo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem build
          $exe = (Get-ChildItem build -Recurse -Filter WinNAT-UI.exe | Select-Object -First 1).FullName
          python .github/collaudo/collaudo_65.py $exe "$env:RUNNER_TEMP/esito"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaudo-issue-65
          path: ${{ runner.temp }}/esito
      - name: Pubblica esito sul branch di collaudo
        if: always()
        shell: pwsh
        run: |
          $dest = "collaudo-esito/run-${{ github.run_id }}"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$env:RUNNER_TEMP/esito/*" $dest -Recurse
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git sparse-checkout disable
          git add collaudo-esito
          git commit -m "collaudo: esito run ${{ github.run_id }}"
          git push origin HEAD:${{ github.ref_name }}
